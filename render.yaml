databases:
  - name: theranostics-db
    plan: free
    databaseName: theranostics
    user: theranostics

services:
  - type: web
    name: theranostics
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn Theranostics.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: theranostics-db
          property: connectionString
